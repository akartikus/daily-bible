# Portes qualité exigées par la constitution (Development Workflow) :
# format check, lint, type check, tests et build sur chaque push/PR.
name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # undici 8 (via jsdom 30) exige Node >= 22.19 — le local tourne en 22.x.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # Publie l'extension non empaquetée (dist/) — chargeable dans Chrome
      # depuis l'artefact du run (validation T029 sans reconstruire en local).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
